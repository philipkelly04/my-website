<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Matchup Lab | PuckLab</title>

  <link rel="stylesheet" href="comparison.css">
  <link rel="stylesheet" href="navigation.css">
</head>

<header class="top-bar">
  <a href="/" class="top-brand">PUCKLAB</a>

  <nav class="top-links" aria-label="Primary navigation">
    <a href="/">Home</a>

    <a href="/game.html?id=2025030416">
      Game Center
    </a>

    <a href="/compare.html" aria-current="page">
      Matchup Lab
    </a>
  </nav>
</header>

  <main class="comparison-container">
    <section class="comparison-intro">
      <p class="eyebrow">TEAM VS TEAM</p>
      <h1>Matchup Lab</h1>

      <p>
        Select two NHL teams to compare their overall performance.
      </p>
    </section>

    <section class="team-selector" aria-label="Choose two teams">
      <div class="select-group">
        <label for="teamOneSelect">Team One</label>

        <select id="teamOneSelect">
          <option value="">Select a team</option>
        </select>
      </div>

      <div class="versus">VS</div>

      <div class="select-group">
        <label for="teamTwoSelect">Team Two</label>

        <select id="teamTwoSelect">
          <option value="">Select a team</option>
        </select>
      </div>

      <button id="compareButton" type="button">
        Compare Teams
      </button>
    </section>

    <p id="comparisonMessage" class="comparison-message">
      Loading NHL teams…
    </p>

    <section id="comparisonResults" hidden>
      <div class="team-headings">
        <article id="teamOneHeading" class="team-heading">
          <img id="teamOneLogo" class="team-logo" alt="">
          <h2 id="teamOneName"></h2>
          <p id="teamOneRank"></p>
        </article>

        <div class="matchup-title">HEAD TO HEAD</div>

        <article id="teamTwoHeading" class="team-heading">
          <img id="teamTwoLogo" class="team-logo" alt="">
          <h2 id="teamTwoName"></h2>
          <p id="teamTwoRank"></p>
        </article>
      </div>

      <div id="comparisonStats" class="comparison-stats"></div>

<section class="h2h-section" aria-labelledby="h2hTitle">
  <div class="h2h-heading">
    <div>
      <p class="eyebrow">RECENT HISTORY</p>
      <h2 id="h2hTitle">Last 10 Meetings</h2>
    </div>

    <p id="h2hSummary" class="h2h-summary"></p>
  </div>

  <div id="h2hGames" class="h2h-games">
    <p class="comparison-message">
      Loading head-to-head results…
    </p>
  </div>
</section>
      
    </section>
  </main>

  <script src="comparison.js"></script>
</body>
</html>
