<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="PuckLab is coming soon."
    />
    <title>PuckLab — Coming Soon</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="coming-soon" aria-labelledby="page-title">
      <h1 id="page-title" class="visually-hidden">PuckLab — Coming Soon</h1>

      <section class="brand-panel" aria-label="PuckLab"></section>

      <section class="ticker" aria-label="Coming soon">
        <div class="ticker__track">
          <span>Coming Soon!</span><span aria-hidden="true">•</span>
          <span aria-hidden="true">Coming Soon!</span><span aria-hidden="true">•</span>
          <span aria-hidden="true">Coming Soon!</span><span aria-hidden="true">•</span>
          <span aria-hidden="true">Coming Soon!</span><span aria-hidden="true">•</span>
          <span aria-hidden="true">Coming Soon!</span><span aria-hidden="true">•</span>
          <span aria-hidden="true">Coming Soon!</span><span aria-hidden="true">•</span>
        </div>
      </section>
      
      <section class="games-section" aria-labelledby="games-title">
  <div class="games-heading">
    <p class="games-label">Live from the NHL</p>
    <h2 id="games-title">NHL Games</h2>
  </div>

  <div id="games-grid" class="games-grid" aria-live="polite">
    <p class="games-message">Loading games…</p>
  </div>
</section>

<section class="teams-section" aria-labelledby="teams-title">
  <div class="teams-heading">
    <p class="games-label">Explore the league</p>
    <h2 id="teams-title">Your Team</h2>
  </div>

  <div class="team-toolbar">
    <label for="team-select">Choose a team</label>

    <select id="team-select" disabled>
      <option value="TOR">Toronto Maple Leafs</option>
    </select>
  </div>

  <p id="team-status" role="status"></p>

  <div class="team-panels">
    <section aria-labelledby="schedule-title">
      <h3 id="schedule-title">2026–27 Schedule</h3>

      <div id="team-schedule">
        <p>Select a team to view its schedule.</p>
      </div>
    </section>

    <section aria-labelledby="roster-title">
      <h3 id="roster-title">Current Roster</h3>

      <div id="team-roster">
        <p>Select a team to view its players.</p>
      </div>
    </section>
  </div>
</section>
      
    </main>

<script src="script.js"></script>
    
  </body>
</html>
